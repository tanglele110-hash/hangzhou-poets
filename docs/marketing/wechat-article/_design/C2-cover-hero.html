<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<title>C2 · 小红书封面 · 数据 hero 版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
  /* C2 局部样式 */
  .hero-region {
    position: absolute; top: 220px; left: 0; right: 0;
    text-align: center; z-index: 10;
  }
  .hero-pre {
    font-family: "JetBrains Mono", monospace;
    font-size: 14px; color: var(--ink-mid);
    letter-spacing: 0.5em; text-indent: 0.5em;
    margin-bottom: 32px;
  }
  .big-number {
    font-family: "JetBrains Mono", monospace;
    font-size: 380px; font-weight: 900;
    line-height: 0.92;
    color: var(--ink);
    letter-spacing: -0.02em;
    text-shadow: 0 4px 0 rgba(244,241,232,0.6);
    margin: 0;
  }
  .big-number .accent { color: var(--tang); }
  .big-unit {
    margin-top: -10px;
    font-family: "Noto Serif SC", serif;
    font-size: 32px; font-weight: 500;
    color: var(--ink-mid);
    letter-spacing: 0.4em; text-indent: 0.4em;
  }
  .product-line {
    position: absolute; top: 880px; left: 0; right: 0;
    text-align: center; z-index: 10;
  }
  .product-cn {
    font-family: "Noto Serif SC", serif;
    font-size: 56px; font-weight: 700;
    color: var(--ink);
    letter-spacing: 0.18em; text-indent: 0.18em;
    line-height: 1.2;
  }
  .product-en {
    margin-top: 18px;
    font-family: "JetBrains Mono", monospace;
    font-size: 16px; color: var(--ink-mid);
    letter-spacing: 0.4em;
  }
  .stats-row {
    position: absolute; top: 1080px; left: 64px; right: 64px;
    display: flex; justify-content: center; gap: 64px;
    z-index: 10;
  }
  .seal-corner {
    position: absolute; top: 232px; right: 90px;
    z-index: 11;
    transform: rotate(-6deg);
  }
  .deco-rule {
    position: absolute; left: 50%; transform: translateX(-50%);
    width: 240px; height: 1px; background: var(--ink-mid); opacity: 0.4;
    z-index: 10;
  }
  .deco-rule.top { top: 850px; }
  .deco-rule.bottom { top: 1010px; }
  .deco-rule::before {
    content: '·';
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%,-50%);
    background: var(--paper);
    color: var(--tang);
    padding: 0 12px; font-size: 22px;
    line-height: 1;
  }
</style>
</head>
<body>
<div class="canvas">
  <!-- 顶栏 -->
  <div class="topbar">
    <div class="wordmark">杭州 · 唐宋诗词名家图鉴</div>
    <div class="index-tag">01 / 11 · 封 面 B</div>
  </div>
  <div class="topbar-divider"></div>

  <!-- Hero 大数字 -->
  <div class="hero-region">
    <div class="hero-pre">EIGHTY-ONE POETS · 700 YEARS</div>
    <div class="big-number"><span class="accent">81</span></div>
    <div class="big-unit">位 与杭州相关的 唐 宋 诗 人</div>
  </div>

  <!-- 朱印 -->
  <div class="seal seal-corner" style="width:108px; height:108px; font-size:60px;">塘</div>

  <!-- 上下分隔线 -->
  <div class="deco-rule top"></div>
  <div class="deco-rule bottom"></div>

  <!-- 产品名 -->
  <div class="product-line">
    <div class="product-cn">杭州唐宋诗词名家图鉴</div>
    <div class="product-en">HANGZHOU TANG-SONG POETS · INTERACTIVE TIMELINE</div>
  </div>

  <!-- 数据条 -->
  <div class="stats-row">
    <div class="stat-mini nsong">
      <div class="num">22</div>
      <div class="label">核 心 代 表</div>
    </div>
    <div class="stat-divider"></div>
    <div class="stat-mini ssong">
      <div class="num">38</div>
      <div class="label">人 物 关 系</div>
    </div>
    <div class="stat-divider"></div>
    <div class="stat-mini">
      <div class="num">700</div>
      <div class="label">年 跨 度</div>
    </div>
    <div class="stat-divider"></div>
    <div class="stat-mini" style="color:var(--ink-mid)">
      <div class="num" style="color:var(--ink-mid)">7</div>
      <div class="label">个 时 期</div>
    </div>
  </div>

  <!-- 底栏 -->
  <div class="bottom-divider"></div>
  <div class="bottom-row">
    <div>
      <div class="bottom-cn">钱 塘 七 百 年</div>
      <div class="bottom-en">QIANTANG · ONE INTERACTIVE MAP · 618-1279</div>
    </div>
    <div>
      <div class="bottom-cta-cn">→ 一图看完</div>
      <div class="bottom-cta-en">QIANTANG.GITHUB.IO</div>
    </div>
  </div>

  <div class="vignette"></div>
  <div class="paper-texture"></div>
</div>
</body>
</html>
