<!-- ============================================================
     animations.jsx · Stage / Sprite / useSprite / Easing
     与 demo-pentagram / demo-kenya-hara 一致
     ============================================================ -->
<script type="text/babel">
(function() {
  const { createContext, useContext, useState, useEffect, useRef } = React;
  const TimeContext = createContext({ time: 0, duration: 10 });
  const SpriteContext = createContext(null);

  const Easing = {
    linear: t => t,
    easeOut: t => 1 - (1 - t) * (1 - t),
    easeInOut: t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
    expoOut: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
    expoIn: t => t === 0 ? 0 : Math.pow(2, 10 * t - 10),
    overshoot: t => {
      const c1 = 1.70158, c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    },
  };

  function interpolate(t, input, output, easing) {
    const [inStart, inEnd] = input;
    const [outStart, outEnd] = output;
    if (t <= inStart) return outStart;
    if (t >= inEnd) return outEnd;
    let progress = (t - inStart) / (inEnd - inStart);
    if (easing) progress = easing(progress);
    return outStart + (outEnd - outStart) * progress;
  }

  function useTime() { return useContext(TimeContext).time; }
  function useSprite() {
    const sprite = useContext(SpriteContext);
    if (!sprite) return { t: 0, elapsed: 0, duration: 0 };
    return sprite;
  }

  // URL 冻结时间：?t=N 或 #t=N 用于截图工作流，跳过 RAF
  // hash 优先（避免 npx serve cleanUrls 吞掉 query）
  const FROZEN_TIME = (() => {
    if (typeof window === 'undefined') return null;
    let v = null;
    const hash = window.location.hash || '';
    if (hash) {
      const hp = new URLSearchParams(hash.replace(/^#/, ''));
      v = hp.get('t');
    }
    if (v == null) {
      const p = new URLSearchParams(window.location.search);
      v = p.get('t');
    }
    return v != null ? parseFloat(v) : null;
  })();

  function Stage({ duration = 5, width = 1920, height = 1080, loop = true, children, bgColor = '#fff' }) {
    const [time, setTime] = useState(FROZEN_TIME != null ? Math.min(FROZEN_TIME, duration - 0.001) : 0);
    const [scale, setScale] = useState(1);
    const rafRef = useRef(null);
    const lastRef = useRef(null);
    const effectiveLoop = (typeof window !== 'undefined' && window.__recording) ? false : loop;

    useEffect(() => {
      function updateScale() {
        const s = Math.min(window.innerWidth / width, window.innerHeight / height);
        setScale(s);
      }
      updateScale();
      window.addEventListener('resize', updateScale);
      return () => window.removeEventListener('resize', updateScale);
    }, [width, height]);

    useEffect(() => {
      let cancelled = false;
      // Freeze mode: just signal ready after fonts loaded; never start RAF
      if (FROZEN_TIME != null) {
        const fixT = Math.max(0, Math.min(duration - 0.001, FROZEN_TIME));
        const ready = () => {
          if (cancelled) return;
          if (typeof window !== 'undefined') window.__ready = true;
          setTime(fixT);
        };
        if (typeof document !== 'undefined' && document.fonts && document.fonts.ready) {
          document.fonts.ready.then(ready);
        } else { ready(); }
        return () => { cancelled = true; };
      }
      function tick(now) {
        if (cancelled) return;
        if (lastRef.current === null) {
          lastRef.current = now;
          if (typeof window !== 'undefined') window.__ready = true;
        }
        const delta = (now - lastRef.current) / 1000;
        lastRef.current = now;
        setTime(prev => {
          const next = prev + delta;
          if (next >= duration) return effectiveLoop ? 0 : duration - 0.001;
          return next;
        });
        rafRef.current = requestAnimationFrame(tick);
      }
      const start = () => { if (!cancelled) rafRef.current = requestAnimationFrame(tick); };
      if (typeof document !== 'undefined' && document.fonts && document.fonts.ready) {
        document.fonts.ready.then(start);
      } else { start(); }
      return () => { cancelled = true; cancelAnimationFrame(rafRef.current); };
    }, [duration, effectiveLoop]);

    const ctx = { time, duration };
    const canvasStyle = {
      position: 'absolute', top: '50%', left: '50%',
      width, height, background: bgColor,
      transformOrigin: 'center center',
      transform: `translate(-50%, -50%) scale(${scale})`,
      overflow: 'hidden',
    };
    return (
      <TimeContext.Provider value={ctx}>
        <div style={{ position: 'fixed', inset: 0, background: bgColor }}>
          <div style={canvasStyle}>{children}</div>
        </div>
      </TimeContext.Provider>
    );
  }

  function Sprite({ start = 0, end, children, style }) {
    const { time } = useContext(TimeContext);
    const actualEnd = end == null ? Infinity : end;
    if (time < start || time >= actualEnd) return null;
    const duration = actualEnd - start;
    const elapsed = time - start;
    const t = duration === 0 ? 1 : Math.max(0, Math.min(1, elapsed / duration));
    return (
      <SpriteContext.Provider value={{ t, elapsed, duration, start, end: actualEnd }}>
        <div style={{ position: 'absolute', inset: 0, ...style }}>{children}</div>
      </SpriteContext.Provider>
    );
  }

  window.Animations = { Stage, Sprite, useTime, useSprite, Easing, interpolate };
})();
</script>

<!-- ============================================================
     SCENE-30s · 钱塘 · 七百年 · A+B 混合
     A = Kenya Hara 极简底
     B = Pentagram 数据海报高潮
     ============================================================ -->
<script type="text/babel">
const { Stage, Sprite, useTime, useSprite, Easing, interpolate } = window.Animations;

const PALETTE = {
  paper:     '#F5F2EB',
  ink:       '#1A1A1A',
  inkSoft:   'rgba(26, 26, 26, 0.55)',
  inkFaint:  'rgba(26, 26, 26, 0.22)',
  gridLine:  'rgba(26, 26, 26, 0.08)',
  vermilion: '#B83B3B',
};

const SERIF = "'Noto Serif SC', 'Songti SC', 'STSong', serif";
const SANS  = "'Inter', 'PingFang SC', 'Noto Sans SC', sans-serif";

// 旧 · 基于 sprite 局部 t（保留以防需要）
function fadeBoth(t, fadeIn = 0.18, fadeOut = 0.18) {
  if (t < fadeIn)        return Easing.expoOut(t / fadeIn);
  if (t > 1 - fadeOut)   return Easing.expoOut((1 - t) / fadeOut);
  return 1;
}

// 新 · 基于绝对秒数（与 sprite 时长无关，避免长 sprite 末尾"长尾淡出"造成段间交叠）
//   t       : sprite 局部 [0, 1]
//   dur     : sprite 总时长（秒）
//   fInSec  : fadeIn 秒数
//   fOutSec : fadeOut 秒数
// 用法：const op = fadeAbs(t, duration, 0.15, 0.20);
function fadeAbs(t, dur, fInSec = 0.15, fOutSec = 0.20) {
  if (!dur || dur <= 0) return 1;
  const elapsed = t * dur;
  if (elapsed < fInSec) return Easing.expoOut(elapsed / fInSec);
  if (elapsed > dur - fOutSec) {
    const remaining = Math.max(0, dur - elapsed);
    return Easing.expoOut(remaining / fOutSec);
  }
  return 1;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  HOOK · 0–3s · A 风格
//  钱塘 · 七百年 + 极淡远山线
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function HookScene() {
  const { t, duration } = useSprite();
  const op    = fadeAbs(t, duration, 0.20, 0.25);
  const titleY = interpolate(t, [0, 0.45], [28, 0], Easing.expoOut);
  const subOp  = interpolate(t, [0.25, 0.55], [0, 1], Easing.easeOut);
  const lineW  = interpolate(t, [0.05, 0.6], [0, 720], Easing.expoOut);

  return (
    <div style={{ position:'absolute', inset:0, opacity: op }}>
      {/* 上方水墨远山（三层 + 一道湖面），两端出血到画外 */}
      <svg
        width="1920" height="1080"
        viewBox="0 0 1920 1080"
        preserveAspectRatio="none"
        style={{ position:'absolute', inset:0 }}
      >
        <g stroke={PALETTE.ink} fill="none" strokeLinecap="round" strokeLinejoin="round">
          {/* 主山线 · 最深 */}
          <path
            d="M -60 360 Q 240 318 520 348 T 1080 362 T 1500 340 T 2000 358"
            strokeWidth="2.2" opacity="0.32"
          />
          {/* 中景山 */}
          <path
            d="M -60 410 Q 360 374 720 400 T 1300 412 T 2000 390"
            strokeWidth="1.3" opacity="0.20"
          />
          {/* 远景 */}
          <path
            d="M -60 472 Q 480 446 920 462 T 1620 474 T 2000 458"
            strokeWidth="0.8" opacity="0.13"
          />
          {/* 湖面横线 · 后段慢慢淡入 */}
          <line
            x1="-60" y1="666" x2="2000" y2="666"
            strokeWidth="0.6" opacity={interpolate(t, [0.45, 0.95], [0, 0.12], Easing.easeOut)}
          />
        </g>
      </svg>

      {/* 中央 wordmark */}
      <div style={{
        position:'absolute', inset:0, display:'flex',
        alignItems:'center', justifyContent:'center', flexDirection:'column',
      }}>
        <div style={{
          fontFamily: SERIF, fontWeight: 200, color: PALETTE.ink,
          fontSize: 132, letterSpacing: '0.32em', paddingLeft: '0.32em',
          transform: `translateY(${titleY}px)`,
        }}>
          钱 塘 · 七 百 年
        </div>

        <div style={{ height: 1, marginTop: 38, background: PALETTE.ink, opacity: 0.32, width: lineW }} />

        <div style={{
          fontFamily: SANS, fontWeight: 300, color: PALETTE.inkSoft,
          fontSize: 22, letterSpacing: '0.45em', marginTop: 28, paddingLeft: '0.45em',
          opacity: subOp,
        }}>
          HANGZHOU &nbsp; · &nbsp; 700 &nbsp; YEARS
        </div>
      </div>

      {/* 角落极小标 */}
      <div style={{
        position:'absolute', left:64, bottom:56,
        fontFamily: SANS, fontSize: 13, color: PALETTE.inkFaint,
        letterSpacing: '0.25em', opacity: subOp,
      }}>
        821 — 1276 &nbsp;/&nbsp; 81 POETS
      </div>
    </div>
  );
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  起 · 唐 · 3–8s · A 风格 · 白居易
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

// 通用：人物名 / 朝代 / 年份 卡片
function PoetCard({ year, name, sub, dynasty }) {
  const { t, duration } = useSprite();
  const op       = fadeAbs(t, duration, 0.18, 0.22);
  const nameY    = interpolate(t, [0, 0.5], [22, 0], Easing.expoOut);
  const subOp    = interpolate(t, [0.30, 0.65], [0, 1], Easing.easeOut);
  const lineH    = interpolate(t, [0.10, 0.6], [0, 320], Easing.expoOut);

  return (
    <div style={{ position:'absolute', inset:0, opacity: op }}>
      {/* 朝代 角标 */}
      <div style={{
        position:'absolute', left: 96, top: 112,
        fontFamily: SANS, fontSize: 14, letterSpacing: '0.5em',
        color: PALETTE.inkFaint,
      }}>
        {dynasty}
      </div>
      <div style={{
        position:'absolute', left: 96, top: 142,
        width: 56, height: 1, background: PALETTE.inkFaint,
      }} />

      {/* 中央列：年份 / 分隔 / 人名 */}
      <div style={{
        position:'absolute', inset:0, display:'flex',
        alignItems:'center', justifyContent:'center',
      }}>
        {/* 年份 竖排数字 */}
        <div style={{
          fontFamily: SANS, fontWeight: 300, fontSize: 56,
          color: PALETTE.inkSoft, letterSpacing: '0.18em',
          writingMode: 'vertical-rl', lineHeight: 1.05,
          marginRight: 80,
        }}>
          {year}
        </div>

        {/* 竖直分隔线 */}
        <div style={{
          width: 1, background: PALETTE.ink, opacity: 0.22,
          height: lineH, marginRight: 80,
        }} />

        {/* 人名 + 副标 */}
        <div style={{ transform: `translateY(${nameY}px)` }}>
          <div style={{
            fontFamily: SERIF, fontWeight: 700, fontSize: 168,
            color: PALETTE.ink, letterSpacing: '0.18em',
            paddingLeft: '0.18em', lineHeight: 1.0,
          }}>
            {name}
          </div>
          <div style={{
            marginTop: 28,
            fontFamily: SERIF, fontWeight: 300, fontSize: 26,
            color: PALETTE.inkSoft, letterSpacing: '0.42em',
            paddingLeft: '0.42em',
            opacity: subOp,
          }}>
            {sub}
          </div>
        </div>
      </div>
    </div>
  );
}

// 通用：诗句横排（一字一字浮起）
function PoemLine({ text, attribution }) {
  const { t, duration } = useSprite();
  const op = fadeAbs(t, duration, 0.18, 0.22);
  const chars = Array.from(text);
  const stagger = 0.06;

  // 自适应字号：保证 7~8 字 + letter-spacing 0.4em 在 1920 内有 200px 安全留白
  const baseSize = chars.length <= 7 ? 128 : 112;
  const ls = 0.40;

  return (
    <div style={{ position:'absolute', inset:0, opacity: op }}>
      <div style={{
        position:'absolute', inset:0, display:'flex',
        alignItems:'center', justifyContent:'center',
      }}>
        <div style={{
          fontFamily: SERIF, fontWeight: 300, fontSize: baseSize,
          color: PALETTE.ink,
          letterSpacing: `${ls}em`,
          paddingLeft: `${ls}em`,
          whiteSpace: 'nowrap',
          textAlign: 'center',
        }}>
          {chars.map((c, i) => {
            const charT = (t - 0.05 - i * stagger) / 0.35;
            const cOp = Math.max(0, Math.min(1, charT));
            const cY  = interpolate(cOp, [0, 1], [22, 0], Easing.expoOut);
            return (
              <span key={i} style={{
                opacity: cOp,
                transform: `translateY(${cY}px)`,
                display: 'inline-block',
              }}>
                {c === ' ' ? '\u00A0' : c}
              </span>
            );
          })}
        </div>
      </div>

      <div style={{
        position:'absolute', left: 96, bottom: 96,
        fontFamily: SERIF, fontWeight: 200, fontSize: 22,
        color: PALETTE.inkSoft, letterSpacing: '0.25em',
        opacity: interpolate(t, [0.5, 0.85], [0, 1], Easing.easeOut),
      }}>
        — {attribution}
      </div>
    </div>
  );
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  转 · 13–16s · A 风格 · 定都临安
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function DingDuScene() {
  const { t, duration } = useSprite();
  const op = fadeAbs(t, duration, 0.18, 0.22);
  const subY  = interpolate(t, [0, 0.5], [16, 0], Easing.expoOut);
  const titleY = interpolate(t, [0.10, 0.55], [28, 0], Easing.expoOut);
  const yearOp = interpolate(t, [0.30, 0.65], [0, 1], Easing.easeOut);
  const lineW  = interpolate(t, [0.20, 0.7], [0, 480], Easing.expoOut);

  return (
    <div style={{ position:'absolute', inset:0, opacity: op }}>
      <div style={{
        position:'absolute', inset:0, display:'flex',
        flexDirection:'column', alignItems:'center', justifyContent:'center',
      }}>
        <div style={{
          fontFamily: SERIF, fontWeight: 300, fontSize: 28,
          color: PALETTE.inkSoft, letterSpacing: '0.5em', paddingLeft:'0.5em',
          transform: `translateY(${subY}px)`,
        }}>
          南 渡 之 后
        </div>

        <div style={{ height: 1, marginTop: 32, marginBottom: 32, background: PALETTE.ink, opacity: 0.22, width: lineW }} />

        <div style={{
          fontFamily: SERIF, fontWeight: 700, fontSize: 168,
          color: PALETTE.ink, letterSpacing: '0.22em', paddingLeft:'0.22em',
          transform: `translateY(${titleY}px)`,
          lineHeight: 1.0,
        }}>
          定 都 临 安
        </div>

        <div style={{
          marginTop: 36,
          fontFamily: SANS, fontWeight: 300, fontSize: 28,
          color: PALETTE.inkSoft, letterSpacing: '0.5em', paddingLeft:'0.5em',
          opacity: yearOp,
        }}>
          1 1 3 8
        </div>
      </div>

      <div style={{
        position:'absolute', left: 96, top: 112,
        fontFamily: SANS, fontSize: 14, letterSpacing: '0.5em',
        color: PALETTE.inkFaint, opacity: yearOp,
      }}>
        南宋 &nbsp; SOUTHERN SONG
      </div>
    </div>
  );
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  转 · 16–19s · 三位词宗（横向并列）
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function ThreeCiScene() {
  const { t, duration } = useSprite();
  const op = fadeAbs(t, duration, 0.18, 0.22);
  const items = [
    { name: '李清照', label: '寓 此' },
    { name: '陆 游',  label: '宦 此' },
    { name: '辛弃疾', label: '登 此' },
  ];
  const stagger = 0.18;
  const subOp = interpolate(t, [0.55, 0.85], [0, 1], Easing.easeOut);

  return (
    <div style={{ position:'absolute', inset:0, opacity: op }}>
      <div style={{
        position:'absolute', left: 96, top: 112,
        fontFamily: SANS, fontSize: 14, letterSpacing: '0.5em',
        color: PALETTE.inkFaint,
      }}>
        南宋 &nbsp; 词 宗
      </div>

      <div style={{
        position:'absolute', inset:0, display:'flex',
        alignItems:'center', justifyContent:'center', gap: 140,
      }}>
        {items.map((p, i) => {
          const localT = (t - 0.05 - i * stagger) / 0.4;
          const aOp = Math.max(0, Math.min(1, localT));
          const aY  = interpolate(aOp, [0, 1], [28, 0], Easing.expoOut);
          return (
            <div key={i} style={{ opacity: aOp, transform: `translateY(${aY}px)`, textAlign:'center' }}>
              <div style={{
                fontFamily: SERIF, fontWeight: 700, fontSize: 112,
                color: PALETTE.ink, letterSpacing: '0.18em', paddingLeft:'0.18em',
                lineHeight: 1.0,
              }}>
                {p.name}
              </div>
              <div style={{
                marginTop: 22,
                width: 56, height: 1, background: PALETTE.inkFaint,
                marginLeft: 'auto', marginRight: 'auto',
              }} />
              <div style={{
                marginTop: 22,
                fontFamily: SERIF, fontWeight: 300, fontSize: 22,
                color: PALETTE.inkSoft, letterSpacing: '0.4em', paddingLeft:'0.4em',
              }}>
                {p.label}
              </div>
            </div>
          );
        })}
      </div>

      <div style={{
        position:'absolute', left: 0, right: 0, bottom: 96, textAlign:'center',
        fontFamily: SANS, fontSize: 14, letterSpacing: '0.4em',
        color: PALETTE.inkFaint, opacity: subOp,
      }}>
        南 宋 词 坛 &nbsp;·&nbsp; 皆 与 临 安 相 涉
      </div>
    </div>
  );
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  转 · 19–22s · 三位 + 地点（竖列接力）
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function ThreePoetsScene() {
  const { t, duration } = useSprite();
  const op = fadeAbs(t, duration, 0.18, 0.22);
  const items = [
    { name: '林 逋',   place: '孤 山', tag: '隐 此' },
    { name: '岳 飞',   place: '栖 霞', tag: '葬 此' },
    { name: '文天祥',  place: '北 去', tag: '过 此' },
  ];
  const stagger = 0.20;

  return (
    <div style={{ position:'absolute', inset:0, opacity: op }}>
      <div style={{
        position:'absolute', left: 96, top: 112,
        fontFamily: SANS, fontSize: 14, letterSpacing: '0.5em',
        color: PALETTE.inkFaint,
      }}>
        亦 有 此 数 人
      </div>

      <div style={{
        position:'absolute', inset:0, display:'flex',
        alignItems:'center', justifyContent:'center', flexDirection:'column', gap: 36,
      }}>
        {items.map((p, i) => {
          const localT = (t - 0.05 - i * stagger) / 0.35;
          const aOp = Math.max(0, Math.min(1, localT));
          const aX  = interpolate(aOp, [0, 1], [40, 0], Easing.expoOut);
          return (
            <div key={i} style={{
              opacity: aOp, transform: `translateX(${aX}px)`,
              display:'flex', alignItems:'baseline', gap: 56,
              minWidth: 720, justifyContent:'space-between',
            }}>
              <div style={{
                fontFamily: SERIF, fontWeight: 700, fontSize: 96,
                color: PALETTE.ink, letterSpacing: '0.16em', paddingLeft:'0.16em',
                lineHeight: 1.0, minWidth: 320,
              }}>
                {p.name}
              </div>
              <div style={{
                fontFamily: SERIF, fontWeight: 300, fontSize: 22,
                color: PALETTE.inkSoft, letterSpacing: '0.32em', paddingLeft:'0.32em',
                flex: 1, textAlign:'left',
                borderBottom: `1px solid ${PALETTE.inkFaint}`, paddingBottom: 14,
              }}>
                {p.tag}
              </div>
              <div style={{
                fontFamily: SERIF, fontWeight: 400, fontSize: 64,
                color: PALETTE.ink, letterSpacing: '0.2em', paddingLeft:'0.2em',
                lineHeight: 1.0, minWidth: 240, textAlign:'right',
              }}>
                {p.place}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  数据落点 · 22–26s · B 风格高潮 · Pentagram 海报
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const POETS = ['白居易', '苏 轼', '李清照', '陆 游', '辛弃疾', '林 逋', '岳 飞', '文天祥', '贺知章', '范仲淹', '王安石', '姜 夔'];

function GridLayer() {
  const { t } = useSprite();
  const op = interpolate(t, [0, 0.25], [0, 1], Easing.easeOut);
  const cols = 8, rows = 4;
  const cellW = 1920 / cols, cellH = 1080 / rows;
  const lines = [];
  for (let i = 1; i < cols; i++) {
    lines.push(<line key={`v${i}`} x1={i*cellW} y1={0} x2={i*cellW} y2={1080} stroke={PALETTE.gridLine} strokeWidth="1" />);
  }
  for (let j = 1; j < rows; j++) {
    lines.push(<line key={`h${j}`} x1={0} y1={j*cellH} x2={1920} y2={j*cellH} stroke={PALETTE.gridLine} strokeWidth="1" />);
  }
  return <svg width="1920" height="1080" style={{ position:'absolute', inset:0, opacity: op }}>{lines}</svg>;
}

function DataPosterScene() {
  const { t, duration } = useSprite();
  const op = fadeAbs(t, duration, 0.20, 0.25);

  // 数字撞入：81 → 38 → 7
  const num1 = interpolate(t, [0.05, 0.30], [180, 0], Easing.expoOut);
  const num2 = interpolate(t, [0.18, 0.42], [180, 0], Easing.expoOut);
  const num3 = interpolate(t, [0.31, 0.55], [180, 0], Easing.expoOut);

  const num1Op = interpolate(t, [0.05, 0.30], [0, 1], Easing.easeOut);
  const num2Op = interpolate(t, [0.18, 0.42], [0, 1], Easing.easeOut);
  const num3Op = interpolate(t, [0.31, 0.55], [0, 1], Easing.easeOut);

  // 朱红下划线
  const lineW = interpolate(t, [0.45, 0.85], [0, 1620], Easing.expoOut);

  // 角落小标
  const tagOp = interpolate(t, [0.55, 0.78], [0, 1], Easing.easeOut);

  // 诗人姓名网格闪现（22-26s 四秒里依次淡入）
  const poetOp = (i) => {
    const localT = (t - 0.40 - (i % 6) * 0.025) / 0.30;
    return Math.max(0, Math.min(1, localT)) * 0.45;
  };

  // wordmark
  const wmOp = interpolate(t, [0.62, 0.88], [0, 1], Easing.easeOut);

  return (
    <div style={{ position:'absolute', inset:0, opacity: op, background: PALETTE.paper }}>
      <GridLayer />

      {/* 12 位诗人姓名作为底层水印 */}
      <div style={{ position:'absolute', inset:0 }}>
        {POETS.map((name, i) => {
          const col = i % 6;
          const row = Math.floor(i / 6);
          return (
            <div key={i} style={{
              position:'absolute',
              left:  `${col * (1920/6) + 48}px`,
              bottom: row === 0 ? 200 : 86,
              fontFamily: SERIF, fontWeight: 300, fontSize: 30,
              color: PALETTE.ink, letterSpacing: '0.3em', paddingLeft:'0.3em',
              opacity: poetOp(i),
            }}>
              {name}
            </div>
          );
        })}
      </div>

      {/* 顶部小标：朝代 */}
      <div style={{
        position:'absolute', left: 64, top: 64,
        fontFamily: SANS, fontWeight: 700, fontSize: 14,
        letterSpacing: '0.5em', color: PALETTE.ink, opacity: tagOp,
      }}>
        七 朝 · 八 十 一 人 · 三 十 八 段 关 系
      </div>
      <div style={{
        position:'absolute', right: 64, top: 64,
        fontFamily: SANS, fontWeight: 400, fontSize: 13,
        letterSpacing: '0.45em', color: PALETTE.inkFaint, opacity: tagOp,
      }}>
        821 — 1276 &nbsp; / &nbsp; 700 YEARS
      </div>

      {/* 三个超大数字 */}
      <div style={{
        position:'absolute', inset:0, display:'flex',
        alignItems:'center', justifyContent:'center', gap: 140,
      }}>
        {[
          { n: '81', label: 'POETS',     cn: '诗人', y: num1, op: num1Op },
          { n: '38', label: 'RELATIONS', cn: '关系', y: num2, op: num2Op },
          { n: '7',  label: 'DYNASTIES', cn: '朝代', y: num3, op: num3Op },
        ].map((it, i) => (
          <div key={i} style={{ textAlign:'center', opacity: it.op }}>
            <div style={{
              fontFamily: SERIF, fontWeight: 900, fontSize: 360,
              color: PALETTE.ink, lineHeight: 1.0,
              transform: `translateY(${it.y}px)`,
            }}>
              {it.n}
            </div>
            <div style={{
              marginTop: 18,
              fontFamily: SANS, fontWeight: 700, fontSize: 16,
              letterSpacing: '0.45em', color: PALETTE.ink,
            }}>
              {it.label}
            </div>
            <div style={{
              marginTop: 8,
              fontFamily: SERIF, fontWeight: 300, fontSize: 18,
              letterSpacing: '0.35em', color: PALETTE.inkSoft, paddingLeft:'0.35em',
            }}>
              {it.cn}
            </div>
          </div>
        ))}
      </div>

      {/* 朱红下划线 */}
      <div style={{
        position:'absolute', left: 150, bottom: 240,
        height: 4, background: PALETTE.vermilion, width: lineW,
      }} />

      {/* 底部 wordmark */}
      <div style={{
        position:'absolute', left: 0, right: 0, bottom: 86, textAlign:'center',
        fontFamily: SERIF, fontWeight: 700, fontSize: 36,
        letterSpacing: '0.55em', color: PALETTE.ink, paddingLeft:'0.55em',
        opacity: wmOp,
      }}>
        钱 塘 · 七 百 年
      </div>
    </div>
  );
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  Coda · 26–30s · A 风格收尾 · 山水写他们 / 他们写山水
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function CodaLine({ text, t, fadeIn, hold, fadeOut }) {
  const localT = (t - fadeIn[0]) / (fadeIn[1] - fadeIn[0]);
  const inOp   = Math.max(0, Math.min(1, localT));
  const outT   = (t - fadeOut[0]) / (fadeOut[1] - fadeOut[0]);
  const outOp  = 1 - Math.max(0, Math.min(1, outT));
  const op     = inOp * outOp;
  const y      = interpolate(inOp, [0, 1], [16, 0], Easing.expoOut);
  return (
    <div style={{
      position:'absolute', inset:0, display:'flex',
      alignItems:'center', justifyContent:'center',
      fontFamily: SERIF, fontWeight: 200, fontSize: 132,
      color: PALETTE.ink, letterSpacing: '0.4em', paddingLeft:'0.4em',
      opacity: op, transform:`translateY(${y}px)`,
    }}>
      {text}
    </div>
  );
}

function CodaScene() {
  const { t, elapsed } = useSprite();
  // 这一段 sprite 时长 = 4s
  // 0.0 - 1.5s: 山水写他们 fade in & hold
  // 1.5 - 2.0s: 第一句 fade out
  // 1.8 - 3.3s: 他们写山水 fade in & hold
  // 3.3 - 4.0s: 整体 fade out

  const stageOp = interpolate(t, [0.85, 1.0], [1, 0], Easing.easeOut);

  return (
    <div style={{ position:'absolute', inset:0, opacity: stageOp }}>
      <CodaLine
        text="山 水 写 他 们"
        t={elapsed}
        fadeIn={[0.10, 0.85]}
        hold={[0.85, 1.50]}
        fadeOut={[1.55, 2.10]}
      />
      <CodaLine
        text="他 们 写 山 水"
        t={elapsed}
        fadeIn={[1.95, 2.70]}
        hold={[2.70, 3.40]}
        fadeOut={[3.50, 4.00]}
      />

      {/* 朱红方印 + 名章（左下） */}
      <div style={{
        position:'absolute', left: 96, bottom: 96,
        display:'flex', alignItems:'center', gap: 18,
        opacity: interpolate(t, [0.20, 0.50], [0, 1], Easing.easeOut) * stageOp,
      }}>
        <div style={{
          width: 44, height: 44, background: PALETTE.vermilion,
          display:'flex', alignItems:'center', justifyContent:'center',
          fontFamily: SERIF, fontWeight: 700, fontSize: 22,
          color: '#F5F2EB', letterSpacing: '0.05em',
        }}>
          钱
        </div>
        <div style={{
          fontFamily: SERIF, fontWeight: 300, fontSize: 18,
          color: PALETTE.inkSoft, letterSpacing: '0.4em', paddingLeft:'0.4em',
        }}>
          钱 塘 · 七 百 年
        </div>
      </div>

      {/* 右下角小英文 */}
      <div style={{
        position:'absolute', right: 96, bottom: 96,
        fontFamily: SANS, fontSize: 12, letterSpacing: '0.5em',
        color: PALETTE.inkFaint,
        opacity: interpolate(t, [0.20, 0.50], [0, 1], Easing.easeOut) * stageOp,
      }}>
        821 — 1276
      </div>
    </div>
  );
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  App · Stage + 时间轴
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

// 段间严格相邻（不重叠）。每段 fadeOut 在自己 sprite 末尾 0.20-0.25s 内完成，
// 下一段从局部 t=0 开始 fadeIn 0.18-0.20s。任何时刻只有一段在场，无交叠。

function App() {
  return (
    <Stage duration={30} width={1920} height={1080} bgColor={PALETTE.paper} loop={false}>
      {/* 0–3s · HOOK */}
      <Sprite start={0}  end={3}>
        <HookScene />
      </Sprite>

      {/* 3–5s · 白居易名 */}
      <Sprite start={3}  end={5}>
        <PoetCard year="8 2 2" name="白居易" sub="杭 州 刺 史" dynasty="唐 · TANG" />
      </Sprite>

      {/* 5–8s · 白诗 */}
      <Sprite start={5}  end={8}>
        <PoemLine text="未能抛得杭州去" attribution="白居易 《春题湖上》" />
      </Sprite>

      {/* 8–11s · 苏轼名 */}
      <Sprite start={8}  end={11}>
        <PoetCard year="1 0 8 9" name="苏 轼" sub="知 杭 州" dynasty="北宋 · NORTHERN SONG" />
      </Sprite>

      {/* 11–13s · 苏堤 */}
      <Sprite start={11} end={13}>
        <PoemLine text="苏堤一道自此而长" attribution="元祐四年 · 苏轼主修" />
      </Sprite>

      {/* 13–16s · 定都临安 */}
      <Sprite start={13} end={16}>
        <DingDuScene />
      </Sprite>

      {/* 16–19s · 三位词宗 */}
      <Sprite start={16} end={19}>
        <ThreeCiScene />
      </Sprite>

      {/* 19–22s · 林逋 / 岳飞 / 文天祥 */}
      <Sprite start={19} end={22}>
        <ThreePoetsScene />
      </Sprite>

      {/* 22–26s · 数据海报 · B 风格高潮 */}
      <Sprite start={22} end={26}>
        <DataPosterScene />
      </Sprite>

      {/* 26–30s · Coda · 山水对仗 */}
      <Sprite start={26} end={30}>
        <CodaScene />
      </Sprite>
    </Stage>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
