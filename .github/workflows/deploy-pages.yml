name: Deploy to GitHub Pages

# 每次 push 到 main 分支后，自动 build 并发布到 GitHub Pages
# Pages URL: https://tanglele110-hash.github.io/hangzhou-poets/
on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 部署需要的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一 ref 上有新部署进来时取消旧的，避免并发把生产搞乱
concurrency:
  group: pages
  cancel-in-progress: false # Pages 已经在跑就让它跑完，避免半成品

jobs:
  build:
    name: Build for GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate data integrity
        run: npm run validate:data

      - name: Build (with /hangzhou-poets/ base path)
        env:
          VITE_BASE_PATH: /hangzhou-poets/
        run: npm run build

      - name: Add 404.html (SPA hash routing fallback)
        # GitHub Pages 上未知路径会找 404.html。我们用的是 hash 路由，
        # 所以让 404.html 等同于 index.html，避免直接刷新带 hash 的 URL 时撞 404
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
