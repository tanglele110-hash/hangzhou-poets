name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支上新 push 进来时，自动取消还在跑的旧任务，省额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate data integrity
        run: npm run validate:data

      - name: Type check (tsc --noEmit)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Report bundle size
        run: |
          echo "## 📦 Bundle 体积" >> $GITHUB_STEP_SUMMARY
          echo '| 文件 | 大小 |' >> $GITHUB_STEP_SUMMARY
          echo '|---|---|' >> $GITHUB_STEP_SUMMARY
          find dist -type f \( -name "*.js" -o -name "*.css" -o -name "*.html" \) -printf '%P\t%s\n' \
            | sort -t$'\t' -k2 -nr \
            | awk -F'\t' '{ printf "| `%s` | %.1f KB |\n", $1, $2/1024 }' \
            >> $GITHUB_STEP_SUMMARY

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14
