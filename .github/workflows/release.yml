name: Release

# 当推一个 v*.*.* 形式的 tag 时触发（如 v1.0.0、v1.2.3、v2.0.0-rc.1）
on:
  push:
    tags:
      - 'v*.*.*'

# 创建 GitHub Release 需要 contents: write
permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 拉全部历史 + tag，方便自动生成 changelog

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate data integrity
        run: npm run validate:data

      - name: Type check (tsc --noEmit)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Package dist as zip
        # 用 Linux 自带的 zip，路径分隔符天然为 /，不会触发 EdgeOne "非法字符"
        run: |
          cd dist
          zip -r "../hangzhou-poets-${GITHUB_REF_NAME}-dist.zip" .
          cd ..
          ls -lh "hangzhou-poets-${GITHUB_REF_NAME}-dist.zip"

      - name: Compute SHA256 checksum
        run: |
          sha256sum "hangzhou-poets-${GITHUB_REF_NAME}-dist.zip" \
            > "hangzhou-poets-${GITHUB_REF_NAME}-dist.zip.sha256"
          cat "hangzhou-poets-${GITHUB_REF_NAME}-dist.zip.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          # 让 GitHub 基于 commit / PR 自动生成 release notes
          generate_release_notes: true
          # 带 rc / beta / alpha 后缀时自动标记为预发布
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          draft: false
          fail_on_unmatched_files: true
          files: |
            hangzhou-poets-${{ github.ref_name }}-dist.zip
            hangzhou-poets-${{ github.ref_name }}-dist.zip.sha256
